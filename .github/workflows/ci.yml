name: Continuou Integration

on: pull_request

jobs:
  ci-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installing Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install, build and test application
        run: |
          cd ./api
          npm ci
          npm run build
          npm test
  ci-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installing Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install, build and test application
        run: |
          cd ./web
          npm ci
          npm run build
          npm test